<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #14161c;
      --surface: #1d2029;
      --surface-2: #262a36;
      --border: #333846;
      --text: #e8eaf0;
      --muted: #9aa1b2;
      --accent: #ff4757;
      --accent-hover: #ff6b78;
      --ok: #2ed573;
      --err: #ff5252;
      --info: #4aa3ff;
      radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      width: 340px;
      height: 560px;
      min-width: 300px;
      min-height: 380px;
      max-width: 800px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
    }

    .scroll-area::-webkit-scrollbar {
      width: 8px;
    }

    .scroll-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #ff4757 0%, #d63031 100%);
      flex-shrink: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      padding: 3px;
    }

    .title {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .version-badge {
      margin-left: auto;
      background: rgba(0, 0, 0, 0.25);
      color: rgba(255, 255, 255, 0.9);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(255, 255, 255, 0.02);
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(255, 71, 87, 0.08);
    }

    .drop-zone-text {
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    #fileInput {
      display: none;
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--surface-2);
      color: var(--text);
      user-select: text;
      -webkit-user-select: text;
    }

    input[type="text"]::placeholder {
      color: #6b7280;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      background: #3a3f4d !important;
      color: #7a8091 !important;
      cursor: not-allowed;
    }

    .btn-fetch {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-fetch:hover:not(:disabled) {
      border-color: var(--ok);
      color: var(--ok);
    }

    .btn-load {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      background: var(--accent);
      color: white;
      font-size: 14px;
    }

    .btn-load:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .status {
      margin-top: 10px;
      padding: 9px;
      border-radius: 6px;
      font-size: 12.5px;
      text-align: center;
      display: none;
    }

    .status.success { background: rgba(46, 213, 115, 0.15); color: var(--ok); }
    .status.error { background: rgba(255, 82, 82, 0.15); color: var(--err); }
    .status.info { background: rgba(74, 163, 255, 0.15); color: var(--info); }

    .btn-settings {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 9px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      color: var(--text);
      transition: transform 0.2s;
    }

    .btn-settings.open {
      transform: rotate(90deg);
    }

    .settings-panel {
      display: none;
    }

    .settings-panel.visible {
      display: block;
    }

    .setting-row {
      margin-bottom: 14px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    .setting-row label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }

    .setting-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .setting-value {
      min-width: 44px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      background: var(--surface-2);
      border-radius: 5px;
      padding: 3px 4px;
    }

    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    input[type="color"] {
      width: 100%;
      height: 34px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-2);
      cursor: pointer;
    }

    .subtitle-toggle {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      text-align: center;
      display: none;
    }

    .btn-toggle {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }

    .btn-toggle.enabled { background: var(--ok); }
    .btn-toggle.enabled:hover { background: #27ae60; }
    .btn-toggle.disabled { background: #ff7675; }
    .btn-toggle.disabled:hover { background: #ff6b6b; }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 6px 0 10px;
      flex-shrink: 0;
    }

    .resizer {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      flex-shrink: 0;
      opacity: 0.5;
      touch-action: none;
    }

    .resizer:hover { opacity: 1; }

    .resizer::before {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      border-radius: 1px;
    }

    .resize-hint {
      font-size: 10px;
      color: #6b7280;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon.png" alt="Subly" class="logo" />
    <div class="title">Subly</div>
    <div class="version-badge" id="versionDisplay">v1.0</div>
  </div>

  <div class="scroll-area">
    <div class="card">
      <div class="card-title">Subtitles</div>
      <div class="drop-zone" id="dropArea">
        <input type="file" id="fileInput" accept=".srt" />
        <div class="drop-zone-text">Click or drag SRT file here</div>
      </div>
      <div class="url-row">
        <input type="text" id="urlInput" placeholder="Or paste SRT URL" />
        <button class="btn btn-fetch" id="fetchBtn" disabled>Fetch</button>
      </div>
      <button class="btn btn-load" id="loadBtn" disabled>Load Subtitles</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>Caption Settings</span>
        <button class="btn-settings" id="toggleSettings" title="Show/hide settings">&#9881;&#65039;</button>
      </div>
      <div class="settings-panel" id="settingsPanel">
        <div class="setting-row">
          <label>Font Size</label>
          <div class="setting-control">
            <input type="range" id="fontSizeRange" min="12" max="64" step="2" />
            <span class="setting-value" id="fontSize">18px</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Position</label>
          <select id="position">
            <option value="bottom">Bottom</option>
            <option value="top">Top</option>
            <option value="middle">Middle</option>
          </select>
        </div>
        <div class="setting-row">
          <label>Background Opacity</label>
          <div class="setting-control">
            <input type="range" id="opacityRange" min="0" max="100" step="10" />
            <span class="setting-value" id="opacity">80%</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Text Color</label>
          <input type="color" id="textColor" value="#ffffff" />
        </div>
      </div>
      <div class="subtitle-toggle" id="subtitleToggle">
        <button class="btn-toggle enabled" id="toggleSubtitlesBtn">Disable Subtitles</button>
      </div>
    </div>

    <div class="footer">
      Subly<span class="resize-hint" id="sizeHint"></span>
    </div>
  </div>

  <div class="resizer" id="resizer" title="Drag to resize"></div>

  <script src="popup.js"></script>
</body>
</html>
